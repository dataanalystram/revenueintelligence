# THROWAWAY mutation-proof workflow (VM16); never merged. Runs only the guarding tests.
name: Mutation proof
on:
  pull_request:
permissions:
  contents: read
jobs:
  guard:
    name: VM16 guards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: "guard 1  (unit) canonical.spec.ts"
        if: always()
        working-directory: apps/api
        run: "pnpm exec vitest run --config vitest.config.mts src/modules/domain/canonical/canonical.spec.ts -t \"value history decision\""
      - name: "guard 2  (int) commercial-writers.int.spec.ts"
        if: always()
        working-directory: apps/api
        run: "pnpm exec prisma generate >/dev/null && pnpm exec vitest run --config vitest.integration.config.mts test/commercial/commercial-writers.int.spec.ts"
      - name: "guard 3  (int) commercial-read.int.spec.ts"
        if: always()
        working-directory: apps/api
        run: "pnpm exec prisma generate >/dev/null && pnpm exec vitest run --config vitest.integration.config.mts test/commercial/commercial-read.int.spec.ts -t \"V24\""
