# THROWAWAY mutation-proof workflow (VM8b); never merged. Runs only the guarding tests.
name: Mutation proof
on:
  pull_request:
permissions:
  contents: read
jobs:
  guard:
    name: VM8b guards
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 'guard 1 (unit) authorized-writes.spec.ts V18'
        if: always()
        working-directory: apps/api
        run: "pnpm exec vitest run --config vitest.config.mts src/modules/tenancy/security/authorized-writes.spec.ts -t \"V18\""
      - name: 'guard 2 (int) account-hierarchy.int.spec.ts V6:'
        if: always()
        working-directory: apps/api
        run: "pnpm exec prisma generate >/dev/null && pnpm exec vitest run --config vitest.integration.config.mts test/context/account-hierarchy.int.spec.ts -t \"V6:\""
