# THROWAWAY mutation-proof workflow (VM11T-mut); never merged. Runs only the guarding tests.
name: Mutation proof
on:
  pull_request:
permissions:
  contents: read
jobs:
  guard:
    name: VM11T-mut guards
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 'guard 1 (int) account-hierarchy.int.spec.ts V5:'
        if: always()
        working-directory: apps/api
        run: "pnpm exec prisma generate >/dev/null && pnpm exec vitest run --config vitest.integration.config.mts test/context/account-hierarchy.int.spec.ts -t \"V5:\""
