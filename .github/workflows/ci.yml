# THROWAWAY mutation-proof workflow (VM19); never merged. Runs only the guarding tests.
name: Mutation proof
on:
  pull_request:
permissions:
  contents: read
jobs:
  guard:
    name: VM19 guards
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: "guard 1 (int) extension-sync.int.spec.ts [V6] VM19_MODE=failed"
        if: always()
        working-directory: apps/api
        env:
          VM19_MODE: "failed"
        run: "pnpm exec prisma generate >/dev/null && pnpm exec vitest run --config vitest.integration.config.mts test/sources/extension-sync.int.spec.ts -t \"V6\""
      - name: "guard 2 (int) extension-sync.int.spec.ts [V6] VM19_MODE=absence"
        if: always()
        working-directory: apps/api
        env:
          VM19_MODE: "absence"
        run: "pnpm exec prisma generate >/dev/null && pnpm exec vitest run --config vitest.integration.config.mts test/sources/extension-sync.int.spec.ts -t \"V6\""
      - name: "guard 3 (int) extension-sync.int.spec.ts [V6] VM19_MODE=missing"
        if: always()
        working-directory: apps/api
        env:
          VM19_MODE: "missing"
        run: "pnpm exec prisma generate >/dev/null && pnpm exec vitest run --config vitest.integration.config.mts test/sources/extension-sync.int.spec.ts -t \"V6\""
      - name: "guard 4 (unit) source-mapping-extension.spec.ts VM19_MODE=missing"
        if: always()
        working-directory: apps/api
        env:
          VM19_MODE: "missing"
        run: "pnpm exec vitest run --config vitest.config.mts src/modules/domain/source-mapping-extension.spec.ts"
