# THROWAWAY mutation-proof workflow (VM11); never merged. Runs only the guarding tests.
name: Mutation proof
on:
  pull_request:
permissions:
  contents: read
jobs:
  guard:
    name: VM11 guards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: "guard 1  (unit) extension-values.spec.ts"
        if: always()
        working-directory: apps/api
        run: "pnpm exec vitest run --config vitest.config.mts src/modules/domain/canonical/extension-values.spec.ts"
      - name: "guard 2  (int) extension-values.int.spec.ts"
        if: always()
        working-directory: apps/api
        run: "pnpm exec prisma generate >/dev/null && pnpm exec vitest run --config vitest.integration.config.mts test/extension/extension-values.int.spec.ts -t \"V5 / V16: secret-like values and restricted fields are never stored\""
      - name: "guard 3  (int) extension-values.int.spec.ts"
        if: always()
        working-directory: apps/api
        run: "pnpm exec prisma generate >/dev/null && pnpm exec vitest run --config vitest.integration.config.mts test/extension/extension-values.int.spec.ts -t \"V5 / V2: rejections\""
