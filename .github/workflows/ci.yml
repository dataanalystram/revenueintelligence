# THROWAWAY mutation-proof workflow (CONTROL (unmutated m10b-impl head)); never merged. Runs only the guarding tests.
name: Mutation proof
on:
  pull_request:
permissions:
  contents: read
jobs:
  guard:
    name: CONTROL (unmutated m10b-impl head) guards
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 'guard 1 (int) source-references.int.spec.ts'
        if: always()
        working-directory: apps/api
        run: "pnpm exec prisma generate >/dev/null && pnpm exec vitest run --config vitest.integration.config.mts test/governance/source-references.int.spec.ts -t \"cannot bind a reference to another tenant\""
      - name: 'guard 2 (int) evidence-provenance.int.spec.ts'
        if: always()
        working-directory: apps/api
        run: "pnpm exec prisma generate >/dev/null && pnpm exec vitest run --config vitest.integration.config.mts test/governance/evidence-provenance.int.spec.ts -t \"refuses citing or naming another tenant\""
      - name: 'guard 3 (int) migrations.int.spec.ts'
        if: always()
        working-directory: apps/api
        run: "pnpm exec prisma generate >/dev/null && pnpm exec vitest run --config vitest.integration.config.mts test/tenancy/migrations.int.spec.ts -t \"foreign keys between tenant-owned tables include tenant_id\""
      - name: 'guard 4 (int) evidence-provenance.int.spec.ts'
        if: always()
        working-directory: apps/api
        run: "pnpm exec prisma generate >/dev/null && pnpm exec vitest run --config vitest.integration.config.mts test/governance/evidence-provenance.int.spec.ts -t \"app role UPDATE / DELETE denied\""
      - name: 'guard 5 (int) migrations.int.spec.ts'
        if: always()
        working-directory: apps/api
        run: "pnpm exec prisma generate >/dev/null && pnpm exec vitest run --config vitest.integration.config.mts test/tenancy/migrations.int.spec.ts -t \"the app role holds exactly the manifest privileges\""
      - name: 'guard 6 (int) source-references.int.spec.ts'
        if: always()
        working-directory: apps/api
        run: "pnpm exec prisma generate >/dev/null && pnpm exec vitest run --config vitest.integration.config.mts test/governance/source-references.int.spec.ts -t \"retires only on accepted proven full runs|database retirement gate refuses\""
      - name: 'guard 7 (unit) source-reference.spec.ts'
        if: always()
        working-directory: apps/api
        run: "pnpm exec vitest run --config vitest.config.mts src/modules/domain/canonical/source-reference.spec.ts"
      - name: 'guard 8 (int) source-references.int.spec.ts'
        if: always()
        working-directory: apps/api
        run: "pnpm exec prisma generate >/dev/null && pnpm exec vitest run --config vitest.integration.config.mts test/governance/source-references.int.spec.ts -t \"retires only on accepted proven full runs\""
      - name: 'guard 9 (int) source-references.int.spec.ts'
        if: always()
        working-directory: apps/api
        run: "pnpm exec prisma generate >/dev/null && pnpm exec vitest run --config vitest.integration.config.mts test/governance/source-references.int.spec.ts -t \"tombstone not revived\""
      - name: 'guard 10 (int) source-references.int.spec.ts'
        if: always()
        working-directory: apps/api
        run: "pnpm exec prisma generate >/dev/null && pnpm exec vitest run --config vitest.integration.config.mts test/governance/source-references.int.spec.ts -t \"legacy kinds refused\""
      - name: 'guard 11 (int) source-references.int.spec.ts'
        if: always()
        working-directory: apps/api
        run: "pnpm exec prisma generate >/dev/null && pnpm exec vitest run --config vitest.integration.config.mts test/governance/source-references.int.spec.ts -t \"identity columns are immutable|re-points to the survivor\""
      - name: 'guard 12 (int) source-references.int.spec.ts'
        if: always()
        working-directory: apps/api
        run: "pnpm exec prisma generate >/dev/null && pnpm exec vitest run --config vitest.integration.config.mts test/governance/source-references.int.spec.ts -t \"add \u2192 ref_added\""
      - name: 'guard 13 (int) evidence-provenance.int.spec.ts'
        if: always()
        working-directory: apps/api
        run: "pnpm exec prisma generate >/dev/null && pnpm exec vitest run --config vitest.integration.config.mts test/governance/evidence-provenance.int.spec.ts -t \"a clean tenant passes\""
      - name: 'guard 14 (unit) evidence.spec.ts'
        if: always()
        working-directory: apps/api
        run: "pnpm exec vitest run --config vitest.config.mts src/modules/domain/canonical/evidence.spec.ts"
      - name: 'guard 15 (int) evidence-provenance.int.spec.ts'
        if: always()
        working-directory: apps/api
        run: "pnpm exec prisma generate >/dev/null && pnpm exec vitest run --config vitest.integration.config.mts test/governance/evidence-provenance.int.spec.ts -t \"writes a valid set of the test catalogue\""
      - name: 'guard 16 (int) source-references.int.spec.ts'
        if: always()
        working-directory: apps/api
        run: "pnpm exec prisma generate >/dev/null && pnpm exec vitest run --config vitest.integration.config.mts test/governance/source-references.int.spec.ts -t \"at 0.1 observe / retire / merge are refused\""
      - name: 'guard 17 (int) evidence-provenance.int.spec.ts'
        if: always()
        working-directory: apps/api
        run: "pnpm exec prisma generate >/dev/null && pnpm exec vitest run --config vitest.integration.config.mts test/governance/evidence-provenance.int.spec.ts -t \"at 0.1 the writer refuses\""
      - name: 'guard 18 (int) source-references.int.spec.ts'
        if: always()
        working-directory: apps/api
        run: "pnpm exec prisma generate >/dev/null && pnpm exec vitest run --config vitest.integration.config.mts test/governance/source-references.int.spec.ts -t \"security_invoker view\""
      - name: 'guard 19 (int) evidence-provenance.int.spec.ts'
        if: always()
        working-directory: apps/api
        run: "pnpm exec prisma generate >/dev/null && pnpm exec vitest run --config vitest.integration.config.mts test/governance/evidence-provenance.int.spec.ts -t \"answers the E5 questions\""
      - name: 'guard 20 (unit) security.spec.ts'
        if: always()
        working-directory: apps/api
        run: "pnpm exec vitest run --config vitest.config.mts src/modules/domain/security/security.spec.ts"
      - name: 'guard 21 (unit) version-features.spec.ts'
        if: always()
        working-directory: apps/api
        run: "pnpm exec vitest run --config vitest.config.mts src/modules/domain/canonical/canonical.spec.ts src/modules/domain/canonical/version-features.spec.ts"
      - name: 'guard 22 (int) migrations.int.spec.ts'
        if: always()
        working-directory: apps/api
        run: "pnpm exec prisma generate >/dev/null && pnpm exec vitest run --config vitest.integration.config.mts test/tenancy/migrations.int.spec.ts -t \"canonical_model_versions equals the code catalogue\""
      - name: 'guard 23 (int) evidence-provenance.int.spec.ts'
        if: always()
        working-directory: apps/api
        run: "pnpm exec prisma generate >/dev/null && pnpm exec vitest run --config vitest.integration.config.mts test/governance/evidence-provenance.int.spec.ts -t \"planted drift\""
      - name: 'guard 24 (int) migrations.int.spec.ts'
        if: always()
        working-directory: apps/api
        run: "pnpm exec prisma generate >/dev/null && pnpm exec vitest run --config vitest.integration.config.mts test/tenancy/migrations.int.spec.ts -t \"V22: the down-script refuses each M10B-only\""
