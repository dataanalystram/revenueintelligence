# THROWAWAY mutation-proof workflow (VM9); never merged. Runs only the guarding tests.
name: Mutation proof
on:
  pull_request:
permissions:
  contents: read
jobs:
  guard:
    name: VM9 guards
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 'guard 1 (unit) source-reference.spec.ts'
        if: always()
        working-directory: apps/api
        run: "pnpm exec vitest run --config vitest.config.mts src/modules/domain/canonical/source-reference.spec.ts"
      - name: 'guard 2 (int) source-references.int.spec.ts'
        if: always()
        working-directory: apps/api
        run: "pnpm exec prisma generate >/dev/null && pnpm exec vitest run --config vitest.integration.config.mts test/governance/source-references.int.spec.ts -t \"tombstone not revived\""
