# THROWAWAY mutation-proof workflow (VM21); never merged. Runs only the guarding tests.
name: Mutation proof
on:
  pull_request:
permissions:
  contents: read
jobs:
  guard:
    name: VM21 guards
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: "guard 1 (int) custom-relationships.int.spec.ts [V8]"
        if: always()
        working-directory: apps/api
        run: "pnpm exec prisma generate >/dev/null && pnpm exec vitest run --config vitest.integration.config.mts test/extension/custom-relationships.int.spec.ts -t \"V8\""
      - name: "guard 2 (int) migrations-m10d.int.spec.ts [V22]"
        if: always()
        working-directory: apps/api
        run: "pnpm exec prisma generate >/dev/null && pnpm exec vitest run --config vitest.integration.config.mts test/tenancy/migrations-m10d.int.spec.ts -t \"V22\""
