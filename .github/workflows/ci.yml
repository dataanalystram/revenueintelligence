# THROWAWAY mutation-proof workflow (VM17); never merged. Runs only the guarding tests.
name: Mutation proof
on:
  pull_request:
permissions:
  contents: read
jobs:
  guard:
    name: VM17 guards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: "guard 1  (unit) canonical.spec.ts"
        if: always()
        working-directory: apps/api
        run: "pnpm exec vitest run --config vitest.config.mts src/modules/domain/canonical/canonical.spec.ts -t \"V1: canonical versions\""
      - name: "guard 2  (int) migrations-m10e.int.spec.ts"
        if: always()
        working-directory: apps/api
        run: "pnpm exec prisma generate >/dev/null && pnpm exec vitest run --config vitest.integration.config.mts test/tenancy/migrations-m10e.int.spec.ts -t \"V1 / V2 / V3: canonical catalogue and module in the database\""
      - name: "guard 3  (int) migrations.int.spec.ts"
        if: always()
        working-directory: apps/api
        run: "pnpm exec prisma generate >/dev/null && pnpm exec vitest run --config vitest.integration.config.mts test/tenancy/migrations.int.spec.ts -t \"canonical_model_versions equals the code catalogue\""
