# THROWAWAY mutation-proof workflow (VM12); never merged. Runs only the guarding tests.
name: Mutation proof
on:
  pull_request:
permissions:
  contents: read
jobs:
  guard:
    name: VM12 guards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: "guard 1  (int) commercial-sync.int.spec.ts"
        if: always()
        working-directory: apps/api
        run: "pnpm exec prisma generate >/dev/null && pnpm exec vitest run --config vitest.integration.config.mts test/sources/commercial-sync.int.spec.ts -t \"V5 / V13 / V14 / V15 / V16 / Q14: the commercial objects and line references\""
      - name: "guard 2  (int) commercial-writers.int.spec.ts"
        if: always()
        working-directory: apps/api
        run: "pnpm exec prisma generate >/dev/null && pnpm exec vitest run --config vitest.integration.config.mts test/commercial/commercial-writers.int.spec.ts -t \"V7 / V8 / V14 / V18\""
