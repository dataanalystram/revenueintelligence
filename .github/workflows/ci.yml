# THROWAWAY mutation-proof workflow (VM6); never merged. Runs only the guarding tests.
name: Mutation proof
on:
  pull_request:
permissions:
  contents: read
jobs:
  guard:
    name: VM6 guards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 'guard 1 (int) migrations-m10f.int.spec.ts'
        if: always()
        working-directory: apps/api
        run: "pnpm exec prisma generate >/dev/null && pnpm exec vitest run --config vitest.integration.config.mts test/tenancy/migrations-m10f.int.spec.ts -t \"V10 race: A renews B\""
      - name: 'guard 2 (int) commercial-writers.int.spec.ts'
        if: always()
        working-directory: apps/api
        run: "pnpm exec prisma generate >/dev/null && pnpm exec vitest run --config vitest.integration.config.mts test/commercial/commercial-writers.int.spec.ts -t \"two-session races resolve\""
