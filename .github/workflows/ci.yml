# THROWAWAY mutation-proof workflow (VM16); never merged. Runs only the guarding tests.
name: Mutation proof
on:
  pull_request:
permissions:
  contents: read
jobs:
  guard:
    name: VM16 guards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: "guard 1 orig (unit) extension-values.spec.ts"
        if: always()
        working-directory: apps/api
        run: "pnpm exec vitest run --config vitest.config.mts src/modules/domain/canonical/extension-values.spec.ts"
      - name: "guard 2 orig (unit) source-mapping-extension.spec.ts"
        if: always()
        working-directory: apps/api
        run: "pnpm exec vitest run --config vitest.config.mts src/modules/domain/source-mapping-extension.spec.ts"
      - name: 'apply test patch'
        if: always()
        run: git apply mutation-test.patch
      - name: "guard 1 patched (unit) extension-values.spec.ts"
        if: always()
        working-directory: apps/api
        run: "pnpm exec vitest run --config vitest.config.mts src/modules/domain/canonical/extension-values.spec.ts"
      - name: "guard 2 patched (unit) source-mapping-extension.spec.ts"
        if: always()
        working-directory: apps/api
        run: "pnpm exec vitest run --config vitest.config.mts src/modules/domain/source-mapping-extension.spec.ts"
