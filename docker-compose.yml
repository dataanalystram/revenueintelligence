# Local development infrastructure.
#   docker compose up -d postgres redis        # just the dependencies (typical)
#   docker compose --profile app up --build    # also run migrate + api + worker in containers
name: lead-intelligence

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lip
      POSTGRES_PASSWORD: lip
      POSTGRES_DB: lip
    ports: ['${LIP_POSTGRES_PORT:-5432}:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the application login role on first start (development only).
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lip -d lip']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # AOF persistence so queued jobs survive a restart, and no eviction: BullMQ
    # must never lose a job under memory pressure (M6, ADR 0013; the worker
    # refuses to start otherwise).
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['${LIP_REDIS_PORT:-6379}:6379']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    profiles: [app]
    build: { context: ., target: migrate }
    environment:
      # Migrations run as the schema owner.
      MIGRATION_DATABASE_URL: postgresql://lip:lip@postgres:5432/lip
    depends_on:
      postgres: { condition: service_healthy }

  api:
    profiles: [app]
    build: { context: ., target: runtime }
    environment:
      &app-env # The application runs as a non-privileged member of lip_app (row-level security applies).
      DATABASE_URL: postgresql://lip_api:lip_api@postgres:5432/lip
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    ports: ['3000:3000']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    profiles: [app]
    build: { context: ., target: runtime }
    command: ['node', 'dist/worker.js']
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
